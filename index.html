<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>무한의 계단 - 캐릭터 컬렉션 & 해금 시스템</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #03030c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Pretendard, sans-serif;
      color: #fff;
      overflow: hidden;
    }
    #mobile-frame {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      background: #070714;
      border: 2px solid #281d45;
      box-shadow: 0 0 50px rgba(112, 0, 255, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* 조작 컨트롤러 */
    #touch-controller {
      height: 90px;
      background: rgba(10, 8, 24, 0.95);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 10px 16px;
      border-top: 1px solid #322557;
      z-index: 10;
    }
    .game-btn {
      background: linear-gradient(180deg, #1b173d 0%, #0d0b21 100%);
      border: 2px solid #00f2fe;
      border-radius: 12px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0, 242, 254, 0.2);
      touch-action: manipulation;
    }
    .game-btn:active {
      transform: scale(0.96);
      background: #00f2fe;
      color: #050515;
    }
    .game-btn.turn-btn {
      border-color: #ff007f;
      box-shadow: 0 3px 12px rgba(255, 0, 127, 0.2);
    }
    .game-btn.turn-btn:active {
      background: #ff007f;
      color: #fff;
    }
    .game-btn span.sub-key {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 2px;
    }

    /* 하단 캐릭터 선택 및 해금 목록 바 */
    #character-roster {
      height: 95px;
      background: #05040e;
      border-top: 1px solid #1f1638;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 10;
    }
    #character-roster::-webkit-scrollbar {
      display: none;
    }
    .char-card {
      flex: 0 0 76px;
      height: 78px;
      background: #120e29;
      border: 2px solid #3a2b66;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }
    .char-card.selected {
      border-color: #00f2fe;
      background: #1c1545;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
    }
    .char-card.locked {
      filter: grayscale(1);
      opacity: 0.55;
      cursor: not-allowed;
    }
    .char-card .card-name {
      font-size: 11px;
      font-weight: bold;
      margin-top: 4px;
    }
    .char-card .card-condition {
      font-size: 8px;
      color: #f43f5e;
      text-align: center;
      margin-top: 2px;
      line-height: 1.1;
    }
  </style>
</head>
<body>

<div id="mobile-frame">
  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="400" height="580"></canvas>
  </div>
  
  <!-- 조작 버튼 -->
  <div id="touch-controller">
    <button class="game-btn turn-btn" id="btn-turn">
      방향 전환
      <span class="sub-key">[Z] / [←]</span>
    </button>
    <button class="game-btn" id="btn-climb">
      오르기
      <span class="sub-key">[X] / [↑]</span>
    </button>
  </div>

  <!-- 캐릭터 해금 목록 UI -->
  <div id="character-roster"></div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 오디오 엔진
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(freq, type = "sine", duration = 0.04) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

// 계단 규격
const STAIR_W = 58;
const STAIR_H = 30;
const ANCHOR_X = canvas.width / 2;
const ANCHOR_Y = canvas.height - 120;

let gameState = "READY";
let score = 0;
let highScore = 0;
let energy = 1.0;
const MAX_ENERGY = 1.0;

let camX = 0;
let camY = 0;
let targetCamX = 0;
let targetCamY = 0;

// 캐릭터 데이터 & 해금 스펙 정의
const characters = [
  { id: "businessman", name: "비즈니스맨", reqScore: 0, unlocked: true, desc: "기본 제공" },
  { id: "boxer", name: "복서", reqScore: 30, unlocked: false, desc: "30계단 달성" },
  { id: "dracula", name: "드라큘라", reqScore: 70, unlocked: false, desc: "70계단 달성" },
  { id: "astronaut", name: "우주비행사", reqScore: 120, unlocked: false, desc: "120계단 달성" }
];
let currentSelectedChar = "businessman";

const player = {
  x: 0,
  y: 0,
  dir: 1,
  scaleX: 1,
  scaleY: 1
};

let stairs = [];
let particles = [];

// 우주 배경 별
const spaceStars = Array.from({ length: 40 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 1.5 + 0.5,
  alpha: Math.random(),
  glowSpeed: Math.random() * 0.02 + 0.01
}));

// 캐릭터 선택 덱 렌더링
function renderCharacterRoster() {
  const roster = document.getElementById("character-roster");
  roster.innerHTML = "";

  characters.forEach(ch => {
    const card = document.createElement("div");
    card.className = `char-card ${ch.id === currentSelectedChar ? 'selected' : ''} ${!ch.unlocked ? 'locked' : ''}`;
    
    // 카드 내부 미니 썸네일
    card.innerHTML = `
      <div style="font-size: 20px;">${getCharEmoji(ch.id)}</div>
      <div class="card-name">${ch.name}</div>
      <div class="card-condition">${ch.unlocked ? '해금 완료' : ch.desc}</div>
    `;

    card.addEventListener("click", () => {
      if (!ch.unlocked) return;
      currentSelectedChar = ch.id;
      renderCharacterRoster();
    });

    roster.appendChild(card);
  });
}

function getCharEmoji(id) {
  if (id === "businessman") return "💼";
  if (id === "boxer") return "🥊";
  if (id === "dracula") return "🧛";
  if (id === "astronaut") return "👨‍🚀";
  return "👤";
}

function checkUnlocks() {
  let newlyUnlocked = false;
  characters.forEach(ch => {
    if (!ch.unlocked && highScore >= ch.reqScore) {
      ch.unlocked = true;
      newlyUnlocked = true;
    }
  });
  if (newlyUnlocked) {
    renderCharacterRoster();
  }
}

function initGame() {
  score = 0;
  energy = 1.0;
  stairs = [{ x: 0, y: 0 }];

  let curX = 0;
  let curDir = 1;
  let runLength = 3;

  for (let i = 1; i < 120; i++) {
    if (runLength <= 0) {
      curDir = -curDir;
      runLength = Math.floor(Math.random() * 4) + 1;
    }
    curX += curDir;
    stairs.push({ x: curX, y: i });
    runLength--;
  }

  player.x = 0;
  player.y = 0;
  player.dir = 1;
  player.scaleX = 1;
  player.scaleY = 1;

  camX = 0;
  camY = 0;
  targetCamX = 0;
  targetCamY = 0;
  particles = [];
}

function appendNextStair() {
  const last = stairs[stairs.length - 1];
  const prev = stairs[stairs.length - 2];
  let curDir = last.x - prev.x;

  if (Math.random() < 0.36) curDir = -curDir;

  stairs.push({
    x: last.x + curDir,
    y: last.y + 1
  });
}

function step(isTurn) {
  if (gameState === "READY") gameState = "PLAY";
  if (gameState !== "PLAY") return;

  if (isTurn) {
    player.dir = -player.dir;
  }

  const nextTargetX = player.x + player.dir;
  const nextTargetY = player.y + 1;
  const expectedStair = stairs[nextTargetY];

  if (expectedStair && expectedStair.x === nextTargetX) {
    player.x = nextTargetX;
    player.y = nextTargetY;
    score++;
    if (score > highScore) {
      highScore = score;
      checkUnlocks();
    }
    energy = Math.min(MAX_ENERGY, energy + 0.13);
    
    player.scaleX = 1.25;
    player.scaleY = 0.8;

    targetCamX = player.x * STAIR_W;
    targetCamY = player.y * STAIR_H;

    appendNextStair();
    playBeep(480 + (score % 16) * 18, "sine", 0.04);
  } else {
    player.x = nextTargetX;
    player.y = nextTargetY;
    gameOver();
  }
}

function gameOver() {
  gameState = "GAMEOVER";
  playBeep(130, "sawtooth", 0.25);
  checkUnlocks();
}

// 키보드 & 터치 바인딩
window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (e.code === "Space" && gameState === "GAMEOVER") {
    initGame();
    gameState = "PLAY";
    return;
  }
  if (e.key === "z" || e.key === "Z" || e.key === "ArrowLeft") step(true);
  else if (e.key === "x" || e.key === "X" || e.key === "ArrowUp") step(false);
});

const turnBtn = document.getElementById("btn-turn");
const climbBtn = document.getElementById("btn-climb");

function bindBtn(btn, isTurn) {
  const trigger = (e) => {
    e.preventDefault();
    if (gameState === "GAMEOVER") {
      initGame();
      gameState = "PLAY";
      return;
    }
    step(isTurn);
  };
  btn.addEventListener("touchstart", trigger, { passive: false });
  btn.addEventListener("mousedown", trigger);
}
bindBtn(turnBtn, true);
bindBtn(climbBtn, false);

function update() {
  if (gameState === "PLAY") {
    const drain = 0.0036 + Math.min(score * 0.00008, 0.009);
    energy -= drain;
    if (energy <= 0) {
      energy = 0;
      gameOver();
    }
  }

  camX += (targetCamX - camX) * 0.35;
  camY += (targetCamY - camY) * 0.35;

  player.scaleX += (1 - player.scaleX) * 0.2;
  player.scaleY += (1 - player.scaleY) * 0.2;
}

// 우주 네온 배경
function drawCosmicBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, "#050310");
  grad.addColorStop(0.5, "#0b0924");
  grad.addColorStop(1, "#170a36");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  spaceStars.forEach(s => {
    s.alpha += s.glowSpeed;
    const a = (Math.sin(s.alpha) + 1) / 2;
    ctx.fillStyle = `rgba(220, 240, 255, ${a * 0.8 + 0.2})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

// 우주 네온 계단
function drawNeonStair(x, y, isCurrent) {
  const w = STAIR_W;
  const h = STAIR_H;
  const rx = x - w / 2;

  ctx.save();
  ctx.fillStyle = isCurrent ? "rgba(0, 242, 254, 0.25)" : "rgba(80, 25, 140, 0.4)";
  ctx.fillRect(rx, y, w, h);

  ctx.fillStyle = isCurrent ? "#ffffff" : "#c084fc";
  ctx.fillRect(rx, y, w, 3);

  ctx.strokeStyle = isCurrent ? "#00f2fe" : "#7928ca";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(rx, y, w, h);
  ctx.restore();
}

// 원작 기반 정밀 도트 캐릭터 렌더링 (비즈니스맨, 복서, 드라큘라, 우주비행사)
function drawPlayer(x, y) {
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(y));
  ctx.scale(player.dir * player.scaleX, player.scaleY);

  const u = 2.4; // 도트 그리드 단위

  // 그림자
  ctx.fillStyle = "rgba(0, 242, 254, 0.2)";
  ctx.beginPath();
  ctx.ellipse(0, 0, 14, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  if (currentSelectedChar === "boxer") {
    // 1. 복서 (붉은 글러브 + 파란 트렁크 + 황금 챔피언 벨트)
    // 맨발/복싱화
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(-3*u, -2*u, 6*u, 2*u);
    // 허벅지 (구릿빛 피부)
    ctx.fillStyle = "#e09f67";
    ctx.fillRect(-3*u, -4*u, 6*u, 2*u);
    // 파란 트렁크
    ctx.fillStyle = "#1d4ed8";
    ctx.fillRect(-4*u, -8*u, 8*u, 4*u);
    // 챔피언 벨트 (골드)
    ctx.fillStyle = "#facc15";
    ctx.fillRect(-4*u, -10*u, 8*u, 2*u);
    // 탄탄한 상체 근육 (구릿빛)
    ctx.fillStyle = "#f5af76";
    ctx.fillRect(-4*u, -16*u, 8*u, 6*u);
    // 붉은 복싱 글러브 (양손)
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(2*u, -14*u, 5*u, 5*u);
    ctx.fillRect(-5*u, -14*u, 3*u, 4*u);
    // 얼굴
    ctx.fillStyle = "#f5af76";
    ctx.fillRect(-3*u, -22*u, 7*u, 6*u);
    // 검은 짧은 모히칸/스포츠 헤어
    ctx.fillStyle = "#111827";
    ctx.fillRect(-3*u, -25*u, 7*u, 3*u);
    ctx.fillRect(0, -26*u, 3*u, 2*u);
    // 눈
    ctx.fillStyle = "#000";
    ctx.fillRect(1*u, -20*u, 2*u, 2*u);

  } else if (currentSelectedChar === "dracula") {
    // 2. 드라큘라 (검은 망토 + 붉은 안감 + 창백한 피부 + 송곳니)
    // 검은 바지/구두
    ctx.fillStyle = "#09090b";
    ctx.fillRect(-3*u, -6*u, 6*u, 6*u);
    // 붉은 안감 망토 뒤편
    ctx.fillStyle = "#991b1b";
    ctx.fillRect(-6*u, -16*u, 11*u, 10*u);
    // 턱시도 상의
    ctx.fillStyle = "#18181b";
    ctx.fillRect(-3*u, -16*u, 7*u, 10*u);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, -15*u, 3*u, 5*u); // 셔츠
    // 창백한 흰 얼굴
    ctx.fillStyle = "#f1f5f9";
    ctx.fillRect(-3*u, -23*u, 7*u, 7*u);
    // 올백 흑발 헤어
    ctx.fillStyle = "#020617";
    ctx.fillRect(-4*u, -26*u, 9*u, 3*u);
    // 붉은 눈 & 송곳니
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(2*u, -20*u, 2*u, 2*u);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(2*u, -18*u, 1*u, 2*u);

  } else if (currentSelectedChar === "astronaut") {
    // 3. 우주비행사 (화이트 수트 + 네온 골드 바이저)
    // 우주화
    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(-4*u, -3*u, 8*u, 3*u);
    // 두터운 우주복 바지 & 본체
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(-4*u, -16*u, 8*u, 13*u);
    // 가슴 생명유지장치 패널
    ctx.fillStyle = "#0284c7";
    ctx.fillRect(-1*u, -13*u, 4*u, 4*u);
    // 둥근 헬멧
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(-5*u, -26*u, 10*u, 10*u);
    // 네온 골드 바이저 (유리창)
    ctx.fillStyle = "#fbbf24";
    ctx.fillRect(0, -24*u, 6*u, 6*u);

  } else {
    // 4. 비즈니스맨 (클래식 정장 + 넥타이)
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(-3*u, -6*u, 6*u, 6*u);
    ctx.fillStyle = "#334155";
    ctx.fillRect(-4*u, -16*u, 8*u, 10*u);
    ctx.fillStyle = "#00f2fe";
    ctx.fillRect(0, -15*u, 2*u, 6*u); // 타이
    ctx.fillStyle = "#fed7aa";
    ctx.fillRect(-3*u, -23*u, 7*u, 7*u); // 얼굴
    ctx.fillStyle = "#451a03";
    ctx.fillRect(-4*u, -26*u, 8*u, 3*u); // 갈색 헤어
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(1*u, -21*u, 4*u, 2*u); // 선글라스
  }

  ctx.restore();
}

function drawHUD() {
  // 타임 바
  const bw = 240;
  const bh = 12;
  const bx = (canvas.width - bw) / 2;
  const by = 25;

  ctx.fillStyle = "rgba(10, 8, 30, 0.8)";
  ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
  ctx.strokeStyle = "#7928ca";
  ctx.strokeRect(bx - 2, by - 2, bw + 4, bh + 4);

  const fillW = Math.max(0, bw * energy);
  ctx.fillStyle = energy > 0.3 ? "#00f2fe" : "#ff007f";
  ctx.fillRect(bx, by, fillW, bh);

  // 점수
  ctx.save();
  ctx.font = "900 40px sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(score, canvas.width / 2, 85);
  ctx.restore();

  if (gameState === "READY") {
    ctx.fillStyle = "rgba(5, 3, 15, 0.75)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00f2fe";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("INFINITE STAIRS", canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "14px sans-serif";
    ctx.fillText("오르기 버튼을 눌러 출발!", canvas.width / 2, canvas.height / 2 + 15);
  } else if (gameState === "GAMEOVER") {
    ctx.fillStyle = "rgba(10, 5, 20, 0.85)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ff007f";
    ctx.font = "900 36px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px monospace";
    ctx.fillText(`SCORE: ${score} (BEST: ${highScore})`, canvas.width / 2, canvas.height / 2 + 15);
    ctx.fillStyle = "#a855f7";
    ctx.font = "13px sans-serif";
    ctx.fillText("버튼 터치 시 재시작", canvas.width / 2, canvas.height / 2 + 50);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawCosmicBackground();

  stairs.forEach((s) => {
    const screenX = ANCHOR_X + (s.x * STAIR_W) - camX;
    const screenY = ANCHOR_Y - (s.y * STAIR_H) + camY;
    if (screenY > -50 && screenY < canvas.height + 50) {
      drawNeonStair(screenX, screenY, s.y === player.y);
    }
  });

  const pScreenX = ANCHOR_X + (player.x * STAIR_W) - camX;
  const pScreenY = ANCHOR_Y - (player.y * STAIR_H) + camY;
  drawPlayer(pScreenX, pScreenY);

  drawHUD();

  requestAnimationFrame(() => {
    update();
    draw();
  });
}

// 최초 셋업
renderCharacterRoster();
initGame();
draw();
</script>
</body>
</html>
