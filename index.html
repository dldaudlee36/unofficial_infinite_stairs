<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>무한의 계단 - 실제 게임 스킨 구현판</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1c23;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }
    #game-container {
      position: relative;
      border: 4px solid #4a3425;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    canvas {
      display: block;
      background: #4da64d;
      image-rendering: pixelated;
    }
    #guide {
      margin-top: 14px;
      display: flex;
      gap: 16px;
      font-size: 14px;
      color: #cbd5e1;
    }
    .badge {
      background: #334155;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #64748b;
      color: #facc15;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="380" height="620"></canvas>
</div>
<div id="guide">
  <div><span class="badge">Z</span> 또는 <span class="badge">←</span> : 방향 전환(돌면서 오르기)</div>
  <div><span class="badge">X</span> 또는 <span class="badge">↑</span> : 오르기</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 오디오
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(freq, type = "square", duration = 0.04) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

// 스크린샷 비율에 맞춘 규격
const STAIR_W = 68;
const STAIR_H = 34;
const ANCHOR_X = canvas.width / 2;
const ANCHOR_Y = canvas.height - 180;

let gameState = "READY"; 
let score = 0;
let energy = 1.0;
const MAX_ENERGY = 1.0;

let camX = 0;
let camY = 0;
let targetCamX = 0;
let targetCamY = 0;

const player = {
  x: 0,
  y: 0,
  dir: 1,
  squash: 1
};

let stairs = [];

function initGame() {
  score = 0;
  energy = 1.0;
  stairs = [{ x: 0, y: 0 }];

  let curX = 0;
  let curDir = 1;
  let runLength = 3;

  for (let i = 1; i < 120; i++) {
    if (runLength <= 0) {
      curDir = -curDir;
      runLength = Math.floor(Math.random() * 4) + 1;
    }
    curX += curDir;
    stairs.push({ x: curX, y: i });
    runLength--;
  }

  player.x = 0;
  player.y = 0;
  player.dir = 1;
  player.squash = 1;

  camX = 0;
  camY = 0;
  targetCamX = 0;
  targetCamY = 0;
}

function appendNextStair() {
  const last = stairs[stairs.length - 1];
  const prev = stairs[stairs.length - 2];
  let curDir = last.x - prev.x;

  if (Math.random() < 0.35) {
    curDir = -curDir;
  }

  stairs.push({
    x: last.x + curDir,
    y: last.y + 1
  });
}

function step(isTurn) {
  if (gameState !== "PLAY") return;

  if (isTurn) {
    player.dir = -player.dir;
  }

  const nextTargetX = player.x + player.dir;
  const nextTargetY = player.y + 1;
  const expectedStair = stairs[nextTargetY];

  if (expectedStair && expectedStair.x === nextTargetX) {
    player.x = nextTargetX;
    player.y = nextTargetY;
    score++;
    energy = Math.min(MAX_ENERGY, energy + 0.13);
    player.squash = 0.8;

    targetCamX = player.x * STAIR_W;
    targetCamY = player.y * STAIR_H;

    appendNextStair();
    playBeep(440 + (score % 15) * 18, "square", 0.04);
  } else {
    player.x = nextTargetX;
    player.y = nextTargetY;
    gameOver();
  }
}

function gameOver() {
  gameState = "GAMEOVER";
  playBeep(120, "sawtooth", 0.25);
}

window.addEventListener("keydown", (e) => {
  if (e.repeat) return;

  if (gameState === "READY") {
    if (e.code === "Space" || e.key === "z" || e.key === "x" || e.key === "ArrowLeft" || e.key === "ArrowUp") {
      gameState = "PLAY";
      if (e.key === "z" || e.key === "ArrowLeft") step(true);
      else if (e.key === "x" || e.key === "ArrowUp") step(false);
    }
  } else if (gameState === "PLAY") {
    if (e.key === "z" || e.key === "Z" || e.key === "ArrowLeft") {
      step(true);
    } else if (e.key === "x" || e.key === "X" || e.key === "ArrowUp") {
      step(false);
    }
  } else if (gameState === "GAMEOVER") {
    if (e.code === "Space" || e.key === "r" || e.key === "R") {
      initGame();
      gameState = "PLAY";
    }
  }
});

function update() {
  if (gameState === "PLAY") {
    const drain = 0.0035 + Math.min(score * 0.00008, 0.009);
    energy -= drain;
    if (energy <= 0) {
      energy = 0;
      gameOver();
    }
  }

  camX += (targetCamX - camX) * 0.35;
  camY += (targetCamY - camY) * 0.35;
  player.squash += (1 - player.squash) * 0.25;
}

// 실제 게임 스크린샷 기반 밀림 배경 렌더링
function drawJungleBackground() {
  // 하늘/숲 상단 그라디언트
  const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bgGrad.addColorStop(0, "#50a042");
  bgGrad.addColorStop(0.5, "#2d7c2a");
  bgGrad.addColorStop(1, "#174e1e");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 야자수 줄기 패턴
  ctx.fillStyle = "#4a6838";
  for (let i = 20; i < canvas.width; i += 75) {
    ctx.fillRect(i, 0, 16, canvas.height);
    // 줄기 가로 줄무늬
    ctx.fillStyle = "#334926";
    for (let j = 0; j < canvas.height; j += 25) {
      ctx.fillRect(i, j, 16, 3);
    }
    ctx.fillStyle = "#4a6838";
  }

  // 나뭇잎 덩어리 실루엣
  ctx.fillStyle = "#388a29";
  for (let y = -20; y < canvas.height; y += 90) {
    ctx.beginPath();
    ctx.arc(40, y, 70, 0, Math.PI * 2);
    ctx.arc(canvas.width - 30, y + 40, 80, 0, Math.PI * 2);
    ctx.arc(canvas.width / 2, y + 20, 60, 0, Math.PI * 2);
    ctx.fill();
  }

  // 바닥 흙길 (하단)
  ctx.fillStyle = "#d3a654";
  ctx.beginPath();
  ctx.moveTo(0, canvas.height);
  ctx.lineTo(canvas.width, canvas.height - 120);
  ctx.lineTo(canvas.width, canvas.height);
  ctx.fill();
}

// 실제 게임 스크린샷 1:1 석재 점박이 계단 블록 드로잉
function drawStair(x, y) {
  const w = STAIR_W;
  const h = STAIR_H;
  const rx = Math.floor(x - w / 2);
  const ry = Math.floor(y);

  // 1. 외곽선 및 입체 본체
  ctx.fillStyle = "#222222";
  ctx.fillRect(rx, ry, w, h);

  // 2. 상단면 (밝은 회색)
  ctx.fillStyle = "#e5e5e5";
  ctx.fillRect(rx + 2, ry + 2, w - 4, h - 4);

  // 3. 우측/하단 음영 (명암 처리)
  ctx.fillStyle = "#b5b5b5";
  ctx.fillRect(rx + w - 6, ry + 2, 4, h - 4);
  ctx.fillRect(rx + 2, ry + h - 6, w - 4, 4);

  // 4. 스크린샷 특유의 불규칙한 직사각형 점박이 픽셀 텍스처
  ctx.fillStyle = "#474747";
  ctx.fillRect(rx + 6, ry + 6, 6, 4);
  ctx.fillRect(rx + 20, ry + 5, 4, 4);
  ctx.fillRect(rx + 36, ry + 7, 8, 3);
  ctx.fillRect(rx + 52, ry + 5, 4, 5);

  ctx.fillStyle = "#666666";
  ctx.fillRect(rx + 10, ry + 16, 5, 5);
  ctx.fillRect(rx + 28, ry + 14, 7, 4);
  ctx.fillRect(rx + 44, ry + 17, 5, 5);

  ctx.fillStyle = "#2b2b2b";
  ctx.fillRect(rx + 16, ry + 24, 6, 4);
  ctx.fillRect(rx + 38, ry + 23, 5, 4);
  ctx.fillRect(rx + 50, ry + 22, 6, 4);
}

// 스크린샷 인물: 둥근 안경, 갈색 왁스 머리, 남색 정장 비즈니스맨
function drawPixelCharacter(x, y) {
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(y));
  ctx.scale(player.dir, player.squash);

  const u = 2.4; // 픽셀 스케일 배율

  // 그림자
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(0, 0, 16, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // 1. 구두 (갈색)
  ctx.fillStyle = "#4a2a18";
  ctx.fillRect(-4 * u, -2 * u, 8 * u, 2 * u);

  // 2. 바지 (남색)
  ctx.fillStyle = "#112656";
  ctx.fillRect(-3 * u, -7 * u, 6 * u, 5 * u);

  // 3. 재킷/몸통 (남색) & 셔츠/넥타이
  ctx.fillStyle = "#183b82";
  ctx.fillRect(-4 * u, -17 * u, 8 * u, 10 * u);

  // 하늘색 셔츠 트임
  ctx.fillStyle = "#d4ecff";
  ctx.fillRect(-1 * u, -17 * u, 4 * u, 8 * u);

  // 빨간 넥타이
  ctx.fillStyle = "#cc1b1b";
  ctx.fillRect(0 * u, -15 * u, 2 * u, 6 * u);

  // 4. 얼굴 (살구색)
  ctx.fillStyle = "#fed7aa";
  ctx.fillRect(-3 * u, -25 * u, 9 * u, 8 * u);

  // 턱수염/하관 음영
  ctx.fillStyle = "#e2b88b";
  ctx.fillRect(-3 * u, -19 * u, 9 * u, 2 * u);

  // 5. 둥근 뿔테 안경 (스크린샷 핵심)
  ctx.fillStyle = "#111111";
  // 안경 렌즈 테두리
  ctx.fillRect(-1 * u, -24 * u, 4 * u, 4 * u);
  ctx.fillRect(4 * u, -24 * u, 4 * u, 4 * u);
  ctx.fillRect(3 * u, -23 * u, 2 * u, 2 * u); // 안경 브릿지
  // 안경 알 투명 채우기
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0 * u, -23 * u, 2 * u, 2 * u);
  ctx.fillRect(5 * u, -23 * u, 2 * u, 2 * u);

  // 6. 갈색 왁스 헤어 (바람에 날리는 잔머리 포함)
  ctx.fillStyle = "#542f13";
  ctx.fillRect(-4 * u, -28 * u, 10 * u, 4 * u);
  ctx.fillRect(-4 * u, -27 * u, 2 * u, 6 * u); // 구레나룻
  // 삐친 머리카락 도트
  ctx.fillRect(-6 * u, -27 * u, 2 * u, 2 * u);
  ctx.fillRect(6 * u, -27 * u, 2 * u, 2 * u);
  ctx.fillRect(1 * u, -30 * u, 3 * u, 2 * u);

  ctx.restore();
}

// 스크린샷 상단 HUD: 금색 테두리 주황색 타임 바 & 레트로 점수 폰트
function drawHUD() {
  const barW = 280;
  const barH = 20;
  const barX = (canvas.width - barW) / 2;
  const barY = 32;

  // 외곽 황금색 프레임
  ctx.fillStyle = "#8a5818";
  ctx.fillRect(barX - 4, barY - 4, barW + 8, barH + 8);
  ctx.fillStyle = "#ffd54f";
  ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);

  // 내부 어두운 홈
  ctx.fillStyle = "#3e1c00";
  ctx.fillRect(barX, barY, barW, barH);

  // 채워지는 주황색 바
  const fillW = Math.max(0, barW * energy);
  ctx.fillStyle = "#e65100";
  ctx.fillRect(barX, barY, fillW, barH);
  // 바 상단 하이라이트 줄
  ctx.fillStyle = "#ff9800";
  ctx.fillRect(barX, barY, fillW, 4);

  // 점수 텍스트 (스크린샷 중앙 숫자 스타일: 검은 외곽선 + 형광 연두색)
  ctx.save();
  ctx.font = "900 44px 'Courier New', Impact, monospace";
  ctx.textAlign = "center";
  ctx.lineWidth = 7;
  ctx.strokeStyle = "#000000";
  ctx.strokeText(score, canvas.width / 2, 105);
  ctx.fillStyle = "#76ff03";
  ctx.fillText(score, canvas.width / 2, 105);
  ctx.restore();

  if (gameState === "READY") {
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffd54f";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("INFINITE STAIRS", canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = "#ffffff";
    ctx.font = "16px sans-serif";
    ctx.fillText("SPACE 키를 눌러 시작", canvas.width / 2, canvas.height / 2 + 20);
  } else if (gameState === "GAMEOVER") {
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ff3b30";
    ctx.font = "900 38px Impact, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px monospace";
    ctx.fillText(`SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
    ctx.fillStyle = "#fcd34d";
    ctx.font = "14px sans-serif";
    ctx.fillText("[SPACE] 또는 [R] 키로 재시작", canvas.width / 2, canvas.height / 2 + 55);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. 밀림 배경
  drawJungleBackground();

  // 2. 스크린샷 텍스처 계단
  const curStair = stairs[player.stepIndex || player.y];
  stairs.forEach((s, idx) => {
    const screenX = ANCHOR_X + (s.x * STAIR_W) - camX;
    const screenY = ANCHOR_Y - (s.y * STAIR_H) + camY;

    if (screenY > -60 && screenY < canvas.height + 60) {
      drawStair(screenX, screenY);
    }
  });

  // 3. 안경 쓴 직장인 캐릭터
  const pScreenX = ANCHOR_X + (player.x * STAIR_W) - camX;
  const pScreenY = ANCHOR_Y - (player.y * STAIR_H) + camY;
  drawPixelCharacter(pScreenX, pScreenY);

  // 4. UI 및 게이지
  drawHUD();

  requestAnimationFrame(() => {
    update();
    draw();
  });
}

initGame();
draw();
</script>
</body>
</html>
