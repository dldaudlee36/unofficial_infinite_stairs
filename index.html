<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cosmic Infinite Stairs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #05030e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Pretendard, sans-serif;
      color: #fff;
      overflow: hidden;
    }
    #mobile-frame {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      background: #08061a;
      border: 2px solid #2d1b54;
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 캔버스와 분리된 독립 최상단 헤더 바 */
    #top-bar {
      height: 44px;
      background: #0d0926;
      border-bottom: 1px solid #231647;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
    }
    .app-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #7928ca;
      text-transform: uppercase;
    }
    #swap-toggle-btn {
      background: #161038;
      border: 1px solid #00f2fe;
      border-radius: 14px;
      color: #00f2fe;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 242, 254, 0.2);
      transition: all 0.15s ease;
    }
    #swap-toggle-btn:active {
      transform: scale(0.95);
    }

    #canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    #touch-controller {
      height: 95px;
      background: rgba(10, 7, 26, 0.95);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 10px 16px;
      border-top: 1px solid #3b286d;
      z-index: 10;
    }
    .game-btn {
      background: linear-gradient(180deg, #1b1340 0%, #0c0824 100%);
      border: 2px solid #00f2fe;
      border-radius: 14px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 242, 254, 0.2);
      touch-action: manipulation;
    }
    .game-btn:active {
      transform: scale(0.96);
      background: #00f2fe;
      color: #050515;
    }
    .game-btn.turn-btn {
      border-color: #ff007f;
      box-shadow: 0 4px 14px rgba(255, 0, 127, 0.2);
    }
    .game-btn.turn-btn:active {
      background: #ff007f;
      color: #fff;
    }
    .game-btn span.sub-key {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 2px;
    }

    #character-roster {
      height: 95px;
      background: #05030f;
      border-top: 1px solid #231647;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 10;
    }
    #character-roster::-webkit-scrollbar { display: none; }
    .char-card {
      flex: 0 0 76px;
      height: 78px;
      background: #110d2b;
      border: 2px solid #372866;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }
    .char-card.selected {
      border-color: #00f2fe;
      background: #1b1347;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.35);
    }
    .char-card.locked {
      filter: grayscale(1);
      opacity: 0.5;
      cursor: not-allowed;
    }
    .char-card .card-name {
      font-size: 11px;
      font-weight: bold;
      margin-top: 4px;
    }
    .char-card .card-condition {
      font-size: 8px;
      color: #f43f5e;
      text-align: center;
      margin-top: 2px;
    }
  </style>
</head>
<body>

<div id="mobile-frame">
  <!-- 독립 상단 헤더 -->
  <div id="top-bar">
    <div class="app-title">Cosmic Stairs</div>
    <button id="swap-toggle-btn">🔄 키 반전: OFF</button>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="400" height="560"></canvas>
  </div>
  
  <div id="touch-controller"></div>

  <div id="character-roster"></div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(freq, type = "sine", duration = 0.04) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const STAIR_W = 58;
const STAIR_H = 30;
const ANCHOR_X = canvas.width / 2;
const ANCHOR_Y = canvas.height - 120;

let gameState = "READY";
let score = 0;
let highScore = 0;
let energy = 1.0;
const MAX_ENERGY = 1.0;

let camX = 0;
let camY = 0;
let targetCamX = 0;
let targetCamY = 0;

let isSwapped = false;

const characters = [
  { id: "businessman", name: "비즈니스맨", reqScore: 0, unlocked: true, desc: "기본 제공" },
  { id: "boxer", name: "복서", reqScore: 20, unlocked: false, desc: "20계단 달성" },
  { id: "dracula", name: "드라큘라", reqScore: 50, unlocked: false, desc: "50계단 달성" }
];
let currentSelectedChar = "businessman";

const player = {
  x: 0,
  y: 0,
  dir: 1,
  scaleX: 1,
  scaleY: 1
};

let stairs = [];

const spaceStars = Array.from({ length: 45 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 1.5 + 0.5,
  alpha: Math.random(),
  glowSpeed: Math.random() * 0.02 + 0.01
}));

const PALETTES = {
  boxer: {
    '.': null,
    'K': '#111827',
    'H': '#dc2626',
    'S': '#f5af76',
    'D': '#d97706',
    'E': '#ffffff',
    'R': '#ef4444',
    'B': '#1d4ed8',
    'G': '#facc15',
    'W': '#e2e8f0'
  },
  businessman: {
    '.': null,
    'K': '#0f172a',
    'H': '#451a03',
    'S': '#fed7aa',
    'C': '#1e293b',
    'J': '#334155',
    'T': '#00f2fe',
    'W': '#ffffff'
  },
  dracula: {
    '.': null,
    'K': '#09090b',
    'S': '#f1f5f9',
    'R': '#dc2626',
    'M': '#18181b',
    'W': '#ffffff',
    'P': '#7c3aed'
  }
};

const SPRITE_MAPS = {
  boxer: [
    "..KKKKKK......",
    ".KHHHHHHK.....",
    ".KSSSSSSK.....",
    ".KSEKSEKK.....",
    ".KSSSSSSK.....",
    ".KDDSSSDK.....",
    ".RRSSSSRR.....",
    "RRRSSSSRRR....",
    "RRRGGGGGRR....",
    ".RRBBBBBRR....",
    "..KBBBBBK.....",
    "..KBBBBBK.....",
    "..KSS.SSK.....",
    "..KSS.SSK.....",
    "..WWW.WWW....."
  ],
  businessman: [
    "..HHHHHH......",
    ".HHHHHHHH.....",
    ".KSSSSSSK.....",
    ".KKKKKKKK.....",
    ".KSSSSSSK.....",
    ".KJJJJJJK.....",
    "KJJTTJJJJK....",
    "KJJTTJJJJK....",
    ".KJJJJJJK.....",
    "..KCCCCK......",
    "..KCCCCK......",
    "..KCCCCK......",
    "..KCC.CK......",
    "..KKK.KKK....."
  ],
  dracula: [
    "..KKKKKK......",
    ".KKKKKKKK.....",
    ".KSSSSSSK.....",
    ".KSRKSRKK.....",
    ".KSSWSSSK.....",
    "MKMMWMMKMR....",
    "MKMMWMMKMR....",
    "MKMMMMMKMR....",
    ".KMMMMMK......",
    "..KMMMMK......",
    "..KMM.MK......",
    "..KKK.KKK....."
  ]
};

function drawPixelMatrix(charKey, x, y, scale = 2.4) {
  const map = SPRITE_MAPS[charKey] || SPRITE_MAPS.businessman;
  const palette = PALETTES[charKey] || PALETTES.businessman;

  const rows = map.length;
  const cols = map[0].length;
  const startX = -Math.floor((cols * scale) / 2);
  const startY = -Math.floor(rows * scale);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const pixelCode = map[r][c];
      const color = palette[pixelCode];
      if (color) {
        ctx.fillStyle = color;
        ctx.fillRect(startX + c * scale, startY + r * scale, scale, scale);
      }
    }
  }
}

function renderControls() {
  const controller = document.getElementById("touch-controller");
  controller.innerHTML = "";

  const turnBtnHTML = `
    <button class="game-btn turn-btn" id="btn-turn">
      방향 전환
      <span class="sub-key">${!isSwapped ? '[Z] / [←]' : '[X] / [↑]'}</span>
    </button>
  `;

  const climbBtnHTML = `
    <button class="game-btn" id="btn-climb">
      오르기
      <span class="sub-key">${!isSwapped ? '[X] / [↑]' : '[Z] / [←]'}</span>
    </button>
  `;

  if (!isSwapped) {
    controller.innerHTML = turnBtnHTML + climbBtnHTML;
  } else {
    controller.innerHTML = climbBtnHTML + turnBtnHTML;
  }

  const turnBtn = document.getElementById("btn-turn");
  const climbBtn = document.getElementById("btn-climb");

  const bind = (btn, isTurn) => {
    const trigger = (e) => {
      e.preventDefault();
      if (gameState === "GAMEOVER") {
        initGame();
        gameState = "PLAY";
        return;
      }
      step(isTurn);
    };
    btn.addEventListener("touchstart", trigger, { passive: false });
    btn.addEventListener("mousedown", trigger);
  };

  bind(turnBtn, true);
  bind(climbBtn, false);
}

const swapToggleBtn = document.getElementById("swap-toggle-btn");
swapToggleBtn.addEventListener("click", () => {
  isSwapped = !isSwapped;
  swapToggleBtn.innerText = isSwapped ? "🔄 키 반전: ON" : "🔄 키 반전: OFF";
  swapToggleBtn.style.borderColor = isSwapped ? "#ff007f" : "#00f2fe";
  swapToggleBtn.style.color = isSwapped ? "#ff007f" : "#00f2fe";
  renderControls();
});

function renderCharacterRoster() {
  const roster = document.getElementById("character-roster");
  roster.innerHTML = "";

  characters.forEach(ch => {
    const card = document.createElement("div");
    card.className = `char-card ${ch.id === currentSelectedChar ? 'selected' : ''} ${!ch.unlocked ? 'locked' : ''}`;
    
    let emoji = "💼";
    if (ch.id === "boxer") emoji = "🥊";
    if (ch.id === "dracula") emoji = "🧛";

    card.innerHTML = `
      <div style="font-size: 20px;">${emoji}</div>
      <div class="card-name">${ch.name}</div>
      <div class="card-condition">${ch.unlocked ? '선택 가능' : ch.desc}</div>
    `;

    card.addEventListener("click", () => {
      if (!ch.unlocked) return;
      currentSelectedChar = ch.id;
      renderCharacterRoster();
    });

    roster.appendChild(card);
  });
}

function checkUnlocks() {
  let changed = false;
  characters.forEach(ch => {
    if (!ch.unlocked && highScore >= ch.reqScore) {
      ch.unlocked = true;
      changed = true;
    }
  });
  if (changed) renderCharacterRoster();
}

function initGame() {
  score = 0;
  energy = 1.0;
  stairs = [{ x: 0, y: 0 }];

  let curX = 0;
  let curDir = 1;
  let runLength = 3;

  for (let i = 1; i < 120; i++) {
    if (runLength <= 0) {
      curDir = -curDir;
      runLength = Math.floor(Math.random() * 4) + 1;
    }
    curX += curDir;
    stairs.push({ x: curX, y: i });
    runLength--;
  }

  player.x = 0;
  player.y = 0;
  player.dir = 1;
  player.scaleX = 1;
  player.scaleY = 1;

  camX = 0;
  camY = 0;
  targetCamX = 0;
  targetCamY = 0;
}

function appendNextStair() {
  const last = stairs[stairs.length - 1];
  const prev = stairs[stairs.length - 2];
  let curDir = last.x - prev.x;

  if (Math.random() < 0.36) curDir = -curDir;

  stairs.push({
    x: last.x + curDir,
    y: last.y + 1
  });
}

function step(isTurn) {
  if (gameState === "READY") gameState = "PLAY";
  if (gameState !== "PLAY") return;

  if (isTurn) {
    player.dir = -player.dir;
  }

  const nextTargetX = player.x + player.dir;
  const nextTargetY = player.y + 1;
  const expectedStair = stairs[nextTargetY];

  if (expectedStair && expectedStair.x === nextTargetX) {
    player.x = nextTargetX;
    player.y = nextTargetY;
    score++;
    if (score > highScore) {
      highScore = score;
      checkUnlocks();
    }
    energy = Math.min(MAX_ENERGY, energy + 0.13);

    player.scaleX = 1.2;
    player.scaleY = 0.8;

    targetCamX = player.x * STAIR_W;
    targetCamY = player.y * STAIR_H;

    appendNextStair();
    playBeep(480 + (score % 16) * 18, "sine", 0.04);
  } else {
    player.x = nextTargetX;
    player.y = nextTargetY;
    gameOver();
  }
}

function gameOver() {
  gameState = "GAMEOVER";
  playBeep(130, "sawtooth", 0.25);
  checkUnlocks();
}

window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (e.code === "Space" && gameState === "GAMEOVER") {
    initGame();
    gameState = "PLAY";
    return;
  }

  const isLeft = (e.key === "z" || e.key === "Z" || e.key === "ArrowLeft");
  const isRight = (e.key === "x" || e.key === "X" || e.key === "ArrowUp");

  if (!isSwapped) {
    if (isLeft) step(true);
    else if (isRight) step(false);
  } else {
    if (isLeft) step(false);
    else if (isRight) step(true);
  }
});

function update() {
  if (gameState === "PLAY") {
    const drain = 0.0036 + Math.min(score * 0.00008, 0.009);
    energy -= drain;
    if (energy <= 0) {
      energy = 0;
      gameOver();
    }
  }

  camX += (targetCamX - camX) * 0.35;
  camY += (targetCamY - camY) * 0.35;

  player.scaleX += (1 - player.scaleX) * 0.2;
  player.scaleY += (1 - player.scaleY) * 0.2;
}

function drawCosmicBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, "#050210");
  grad.addColorStop(0.5, "#0b0722");
  grad.addColorStop(1, "#180a36");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  spaceStars.forEach(s => {
    s.alpha += s.glowSpeed;
    const a = (Math.sin(s.alpha) + 1) / 2;
    ctx.fillStyle = `rgba(220, 240, 255, ${a * 0.8 + 0.2})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawNeonStair(x, y, isCurrent) {
  const w = STAIR_W;
  const h = STAIR_H;
  const rx = x - w / 2;

  ctx.save();
  ctx.fillStyle = isCurrent ? "rgba(0, 242, 254, 0.25)" : "rgba(80, 25, 140, 0.4)";
  ctx.fillRect(rx, y, w, h);

  ctx.fillStyle = isCurrent ? "#ffffff" : "#c084fc";
  ctx.fillRect(rx, y, w, 3);

  ctx.strokeStyle = isCurrent ? "#00f2fe" : "#7928ca";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(rx, y, w, h);
  ctx.restore();
}

function drawPlayer(x, y) {
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(y));
  ctx.scale(player.dir * player.scaleX, player.scaleY);

  ctx.fillStyle = "rgba(0, 242, 254, 0.25)";
  ctx.beginPath();
  ctx.ellipse(0, 0, 16, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  drawPixelMatrix(currentSelectedChar, 0, 0, 2.5);
  ctx.restore();
}

function drawHUD() {
  const bw = 240;
  const bh = 12;
  const bx = (canvas.width - bw) / 2;
  const by = 25;

  ctx.fillStyle = "rgba(10, 8, 30, 0.8)";
  ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
  ctx.strokeStyle = "#7928ca";
  ctx.strokeRect(bx - 2, by - 2, bw + 4, bh + 4);

  const fillW = Math.max(0, bw * energy);
  ctx.fillStyle = energy > 0.3 ? "#00f2fe" : "#ff007f";
  ctx.fillRect(bx, by, fillW, bh);

  ctx.save();
  ctx.font = "900 40px sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(score, canvas.width / 2, 85);
  ctx.restore();

  if (gameState === "READY") {
    ctx.fillStyle = "rgba(5, 3, 15, 0.75)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00f2fe";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("COSMIC INFINITE STAIRS", canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "14px sans-serif";
    ctx.fillText("오르기 버튼을 눌러 출발!", canvas.width / 2, canvas.height / 2 + 15);
  } else if (gameState === "GAMEOVER") {
    ctx.fillStyle = "rgba(10, 5, 20, 0.85)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ff007f";
    ctx.font = "900 36px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px monospace";
    ctx.fillText(`SCORE: ${score} (BEST: ${highScore})`, canvas.width / 2, canvas.height / 2 + 15);
    ctx.fillStyle = "#a855f7";
    ctx.font = "13px sans-serif";
    ctx.fillText("하단 버튼 터치 시 재시작", canvas.width / 2, canvas.height / 2 + 50);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawCosmicBackground();

  stairs.forEach((s) => {
    const screenX = ANCHOR_X + (s.x * STAIR_W) - camX;
    const screenY = ANCHOR_Y - (s.y * STAIR_H) + camY;
    if (screenY > -50 && screenY < canvas.height + 50) {
      drawNeonStair(screenX, screenY, s.y === player.y);
    }
  });

  const pScreenX = ANCHOR_X + (player.x * STAIR_W) - camX;
  const pScreenY = ANCHOR_Y - (player.y * STAIR_H) + camY;
  drawPlayer(pScreenX, pScreenY);

  drawHUD();

  requestAnimationFrame(() => {
    update();
    draw();
  });
}

renderControls();
renderCharacterRoster();
initGame();
draw();
</script>
</body>
</html>
