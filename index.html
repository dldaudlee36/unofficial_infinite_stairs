<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cosmic Infinite Stairs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #05030e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Pretendard, sans-serif;
      color: #fff;
      overflow-x: hidden;
      padding: 20px;
    }

    #game-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 24px;
      max-width: 820px;
      width: 100%;
    }

    #mobile-frame {
      position: relative;
      width: 100vw;
      max-width: 400px;
      height: 840px;
      max-height: 90vh;
      background: #08061a;
      border: 2px solid #2d1b54;
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(138, 43, 226, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    #top-bar {
      height: 46px;
      background: #0d0926;
      border-bottom: 1px solid #231647;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
    }
    .title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .app-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #a855f7;
      text-transform: uppercase;
    }
    .mode-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      letter-spacing: 0;
    }
    .mode-badge.normal {
      background: rgba(0, 242, 254, 0.15);
      color: #00f2fe;
      border: 1px solid #00f2fe;
    }
    .mode-badge.hardcore {
      background: rgba(255, 0, 127, 0.15);
      color: #ff007f;
      border: 1px solid #ff007f;
    }

    #settings-btn {
      background: #161038;
      border: 1px solid #7928ca;
      border-radius: 8px;
      color: #00f2fe;
      font-size: 16px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 242, 254, 0.2);
    }
    #settings-btn:active { transform: scale(0.92); }

    #canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    #touch-controller {
      height: 95px;
      background: rgba(10, 7, 26, 0.95);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 10px 16px;
      border-top: 1px solid #3b286d;
      z-index: 10;
    }
    .game-btn {
      background: linear-gradient(180deg, #1b1340 0%, #0c0824 100%);
      border: 2px solid #00f2fe;
      border-radius: 14px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 242, 254, 0.2);
      touch-action: manipulation;
    }
    .game-btn:active {
      transform: scale(0.96);
      background: #00f2fe;
      color: #050515;
    }
    .game-btn.turn-btn {
      border-color: #ff007f;
      box-shadow: 0 4px 14px rgba(255, 0, 127, 0.2);
    }
    .game-btn.turn-btn:active {
      background: #ff007f;
      color: #fff;
    }
    .game-btn span.sub-key {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 2px;
      color: #facc15;
    }

    #character-roster {
      height: 90px;
      background: #05030f;
      border-top: 1px solid #231647;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      overflow-x: auto;
      scrollbar-width: none;
      scroll-behavior: smooth;
      z-index: 10;
    }
    #character-roster::-webkit-scrollbar { display: none; }
    .char-card {
      flex: 0 0 72px;
      height: 74px;
      background: #110d2b;
      border: 2px solid #372866;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }
    .char-card.selected {
      border-color: #00f2fe;
      background: #1b1347;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.35);
    }
    .char-card .card-name {
      font-size: 11px;
      font-weight: bold;
      margin-top: 4px;
      text-align: center;
    }
    .char-card .card-status {
      font-size: 9px;
      color: #a855f7;
      text-align: center;
      margin-top: 2px;
    }
    .char-card.selected .card-status {
      color: #00f2fe;
      font-weight: bold;
    }

    #history-panel {
      width: 320px;
      height: 840px;
      max-height: 90vh;
      background: rgba(13, 9, 38, 0.75);
      backdrop-filter: blur(12px);
      border: 2px solid #2d1b54;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .panel-header {
      height: 46px;
      background: #09061c;
      border-bottom: 1px solid #2d1b54;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 800;
      color: #00f2fe;
      letter-spacing: 0.5px;
    }
    .panel-clear-btn {
      background: transparent;
      border: 1px solid #ff007f;
      color: #ff007f;
      font-size: 10px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .panel-clear-btn:active {
      background: #ff007f;
      color: #fff;
    }

    .history-tab-bar {
      display: flex;
      background: #0d0926;
      border-bottom: 1px solid #2d1b54;
    }
    .history-tab-btn {
      flex: 1;
      padding: 8px 0;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      border-bottom: 2px solid transparent;
    }
    .history-tab-btn.active.normal {
      color: #00f2fe;
      border-bottom-color: #00f2fe;
      background: rgba(0, 242, 254, 0.05);
    }
    .history-tab-btn.active.hardcore {
      color: #ff007f;
      border-bottom-color: #ff007f;
      background: rgba(255, 0, 127, 0.05);
    }

    .history-table-wrap {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #7928ca transparent;
    }
    .history-table-wrap::-webkit-scrollbar { width: 4px; }
    .history-table-wrap::-webkit-scrollbar-thumb {
      background: #7928ca;
      border-radius: 4px;
    }
    table.history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }
    table.history-table th {
      position: sticky;
      top: 0;
      background: #110d2b;
      color: #a855f7;
      padding: 10px 12px;
      font-size: 11px;
      font-weight: bold;
      border-bottom: 1px solid #2d1b54;
      z-index: 1;
    }
    table.history-table td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(45, 27, 84, 0.4);
      color: #e2e8f0;
      font-family: monospace;
    }
    table.history-table tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    table.history-table tr:hover { background: rgba(0, 242, 254, 0.08); }
    .score-badge {
      font-weight: 800;
      color: #00f2fe;
    }
    .score-badge.top {
      color: #ff007f;
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
    }
    .empty-state {
      padding: 40px 16px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 780px) {
      #game-container { flex-direction: column; }
      #history-panel {
        width: 100%;
        max-width: 400px;
        height: 380px;
      }
    }

    #settings-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 2, 15, 0.88);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-box {
      width: 90%;
      background: #120e2e;
      border: 2px solid #7928ca;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(121, 40, 202, 0.4);
    }
    .modal-title {
      font-size: 16px;
      font-weight: bold;
      color: #00f2fe;
      text-align: center;
      margin-bottom: 16px;
    }
    .key-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .key-assign-btn {
      background: #1f1847;
      border: 1px solid #3b82f6;
      color: #facc15;
      font-size: 13px;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      min-width: 80px;
      text-align: center;
    }
    .key-assign-btn.listening {
      border-color: #ff007f;
      background: #3b0724;
      color: #ff007f;
      animation: blink 0.8s infinite;
    }
    @keyframes blink { 50% { opacity: 0.5; } }

    #mode-toggle-btn {
      width: 100%;
      background: #161038;
      border: 2px solid #00f2fe;
      color: #00f2fe;
      font-size: 13px;
      font-weight: 800;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.2s ease;
    }
    #mode-toggle-btn.hardcore {
      border-color: #ff007f;
      color: #ff007f;
      background: #26091c;
    }

    #golden-rush-btn {
      width: 100%;
      background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
      border: 2px solid #fffb00;
      color: #05030e;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.4);
      transition: all 0.15s ease;
    }
    #golden-rush-btn:active {
      transform: scale(0.96);
      box-shadow: 0 0 24px rgba(255, 215, 0, 0.8);
    }

    .modal-close-btn {
      width: 100%;
      background: #00f2fe;
      border: none;
      color: #05030e;
      font-weight: 800;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="mobile-frame">
    <div id="top-bar">
      <div class="title-wrap">

    <div id="canvas-wrap">

    <div id="settings-modal">
      <div class="modal-box">
        <div class="modal-title">설정 & 치트</div>

          <span>방향 전환 키:</span>
          <button class="key-assign-btn" id="bind-turn-btn"></button>

          버튼을 누르고 변경할 키를 입력하세요.
        </div>
        
        <button id="mode-toggle-btn">🎮 모드: 일반인 모드 (하트 ON)</button>
        <button id="golden-rush-btn">⚡ Golden Rush (+30F)</button>

  </div>

  <div id="history-panel">
    <div class="panel-header">
      <span class="panel-title">🏆 RECENT 20 RUNS</span>

    </div>

    <div class="history-tab-bar">
      <button class="history-tab-btn active normal" id="tab-normal">일반인 모드</button>
      <button class="history-tab-btn hardcore" id="tab-hardcore">꺼드럭 모드</button>
    </div>

    <div class="history-table-wrap">
      <table class="history-table">
        <thead>
          <tr>
            <th style="width: 15%;">#</th>
            <th style="width: 40%;">캐릭터</th>
            <th style="width: 25%;">기록</th>
            <th style="width: 20%;">시간</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(freq, type = "sine", duration = 0.04) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playReviveSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
    setTimeout(() => playBeep(freq, "triangle", 0.08), i * 50);
  });
}

function playHeartEarnSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  [600, 900].forEach((freq, i) => {
    setTimeout(() => playBeep(freq, "sine", 0.06), i * 60);
  });
}

const processedCanvases = {
  sheet8: null,
  among: null,
  pixel1: null,
  pixel2: null
};

function cleanAndProcessImage(url, key) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const off = document.createElement("canvas");
      off.width = img.naturalWidth || img.width;
      off.height = img.naturalHeight || img.height;
      const octx = off.getContext("2d");
      octx.drawImage(img, 0, 0);

      try {
        const imgData = octx.getImageData(0, 0, off.width, off.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i] > 190 && d[i + 1] > 190 && d[i + 2] > 190) {
            d[i + 3] = 0;
          }
        }
        octx.putImageData(imgData, 0, 0);
        processedCanvases[key] = off;
      } catch (err) {
        processedCanvases[key] = img;
      }
      resolve();
    };
    img.onerror = () => resolve();
    img.src = url;
  });
}

const STAIR_W = 58;
const STAIR_H = 30;
const ANCHOR_X = canvas.width / 2;
const ANCHOR_Y = canvas.height - 120;

let gameState = "READY";
let score = 0;
let highScore = 0;
let energy = 1.0;
const MAX_ENERGY = 1.0;

let camX = 0;
let camY = 0;
let targetCamX = 0;
let targetCamY = 0;

let isAutoClimbing = false;
let isNormalMode = true;
let boosterUsed = false;
let currentProvocation = "";

let reviveHearts = 0;
let lastHeartThreshold = 0;
let lastSafeStair = { x: 0, y: 0 };
let countdownNumber = 3;
let countdownTimer = null;

const keyBindings = {
  turn: { code: "KeyZ", label: "Z" },
  climb: { code: "KeyX", label: "X" }
};
let listeningTarget = null;

const characters = [
  { id: "businessman", name: "비즈니스맨", sourceKey: "sheet8", grid: { col: 1, row: 2 } },
  { id: "boxer", name: "복서", sourceKey: "sheet8", grid: { col: 0, row: 1 } },
  { id: "dracula", name: "드라큘라", sourceKey: "sheet8", grid: { col: 0, row: 3 } },
  { id: "delivery", name: "택배기사", sourceKey: "sheet8", grid: { col: 1, row: 3 } },
  { id: "sheriff", name: "보안관", sourceKey: "sheet8", grid: { col: 1, row: 1 } },
  { id: "tennis", name: "테니스선수", sourceKey: "sheet8", grid: { col: 0, row: 2 } },
  { id: "soldier", name: "근위병", sourceKey: "sheet8", grid: { col: 0, row: 0 } },
  { id: "bunny", name: "바니걸", sourceKey: "sheet8", grid: { col: 1, row: 0 }, colOffset: 0 },
  { id: "among", name: "어몽어스", sourceKey: "among" },
  { id: "redboy", name: "빨간티소년", sourceKey: "pixel1" },
  { id: "redhair", name: "붉은머리소년", sourceKey: "pixel2" }
];
let currentSelectedChar = "businessman";

let currentViewTab = "normal";
let playHistory = [];
try {
  const saved = localStorage.getItem("cosmic_stair_history_v2");
  if (saved) playHistory = JSON.parse(saved);
} catch (e) {
  playHistory = [];
}

function recordGameResult(finalScore) {
  const charObj = characters.find(c => c.id === currentSelectedChar) || characters[0];
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

  const entry = {
    mode: isNormalMode ? "normal" : "hardcore",
    charIcon: getCharIcon(charObj.id),
    charName: charObj.name,
    score: finalScore,
    time: timeStr
  };

  playHistory.unshift(entry);
  if (playHistory.length > 50) {
    playHistory.pop();
  }

  try {
    localStorage.setItem("cosmic_stair_history_v2", JSON.stringify(playHistory));
  } catch (e) {}

  renderHistoryTable();
}

function renderHistoryTable() {
  const tbody = document.getElementById("history-body");
  tbody.innerHTML = "";

  const filtered = playHistory.filter(h => h.mode === currentViewTab).slice(0, 20);

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty-state">[${currentViewTab === 'normal' ? '일반인 모드' : '꺼드럭 모드'}] 기록이 없습니다.<br>계단을 올라 첫 랭킹을 달성하세요!</td></tr>`;
    return;
  }

  const maxVal = Math.max(...filtered.map(h => h.score));

  filtered.forEach((h, idx) => {
    const tr = document.createElement("tr");
    const isTop = h.score === maxVal && maxVal > 0;
    tr.innerHTML = `
      <td style="color: #64748b;">${idx + 1}</td>
      <td>${h.charIcon} ${h.charName}</td>
      <td><span class="score-badge ${isTop ? 'top' : ''}">${h.score}F</span></td>
      <td style="color: #94a3b8; font-size: 11px;">${h.time}</td>
    `;
    tbody.appendChild(tr);
  });
}

const tabNormalBtn = document.getElementById("tab-normal");
const tabHardcoreBtn = document.getElementById("tab-hardcore");

tabNormalBtn.addEventListener("click", () => {
  currentViewTab = "normal";
  tabNormalBtn.className = "history-tab-btn active normal";
  tabHardcoreBtn.className = "history-tab-btn hardcore";
  renderHistoryTable();
});

tabHardcoreBtn.addEventListener("click", () => {
  currentViewTab = "hardcore";
  tabHardcoreBtn.className = "history-tab-btn active hardcore";
  tabNormalBtn.className = "history-tab-btn normal";
  renderHistoryTable();
});

document.getElementById("clear-history-btn").addEventListener("click", () => {
  if (confirm(`현재 탭 [${currentViewTab === 'normal' ? '일반인 모드' : '꺼드럭 모드'}] 기록을 모두 초기화하시겠습니까?`)) {
    playHistory = playHistory.filter(h => h.mode !== currentViewTab);
    localStorage.setItem("cosmic_stair_history_v2", JSON.stringify(playHistory));
    renderHistoryTable();
  }
});

const player = {
  x: 0,
  y: 0,
  dir: 1,
  scaleX: 1,
  scaleY: 1,
  bounceY: 0
};

let stairs = [];

const spaceStars = Array.from({ length: 45 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 1.5 + 0.5,
  alpha: Math.random(),
  glowSpeed: Math.random() * 0.02 + 0.01
}));

function drawPlayerSprite(x, y) {
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(y + player.bounceY));
  ctx.scale(-player.dir * player.scaleX, player.scaleY);

  ctx.fillStyle = "rgba(0, 242, 254, 0.25)";
  ctx.beginPath();
  ctx.ellipse(0, -player.bounceY, 20, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  const char = characters.find(c => c.id === currentSelectedChar) || characters[0];
  const src = processedCanvases[char.sourceKey];

  if (src && (src.width || src.naturalWidth)) {
    const totalW = src.width || src.naturalWidth;
    const totalH = src.height || src.naturalHeight;

    let sx = 0, sy = 0, sw = totalW, sh = totalH;

    if (char.sourceKey === "sheet8") {
      const blockW = totalW / 2;
      const blockH = totalH / 4;
      const rawCellW = blockW / 4;
      const rawCellH = blockH / 2;

      const blockX = char.grid.col * blockW;
      const blockY = char.grid.row * blockH;

      const padTop = rawCellH * 0.12;
      const padBottom = rawCellH * 0.04;
      const padX = rawCellW * 0.08;

      const chosenCol = (char.colOffset !== undefined) ? char.colOffset : 1;
      const cellX = blockX + (rawCellW * chosenCol);
      const cellY = blockY;

      sx = cellX + padX;
      sy = cellY + padTop;
      sw = rawCellW - (padX * 2);
      sh = rawCellH - (padTop + padBottom);

    } else if (char.sourceKey === "pixel1" || char.sourceKey === "pixel2") {
      sw = totalW / 4;
      sh = totalH / 4;
      sx = 1 * sw;
      sy = 2 * sh;
    } else if (char.sourceKey === "among") {
      sx = 0; sy = 0;
      sw = totalW; sh = totalH;
    }

    const TARGET_MAX_H = 75;
    const TARGET_MAX_W = 75;
    const aspect = sw / sh;

    let drawW, drawH;
    if (aspect > 1) {
      drawW = TARGET_MAX_W;
      drawH = TARGET_MAX_W / aspect;
    } else {
      drawH = TARGET_MAX_H;
      drawW = TARGET_MAX_H * aspect;
    }

    ctx.drawImage(src, sx, sy, sw, sh, -drawW / 2, -drawH, drawW, drawH);

  } else {
    ctx.fillStyle = "#00f2fe";
    ctx.fillRect(-16, -50, 32, 50);
  }

  ctx.restore();
}

function triggerGoldenRush() {
  if (isAutoClimbing || gameState === "REVIVE_COUNTDOWN") return;
  settingsModal.style.display = "none";
  
  if (gameState === "GAMEOVER") {
    initGame();
  }
  gameState = "PLAY";
  isAutoClimbing = true;
  boosterUsed = true;

  let stepsLeft = 30;

  const climbInterval = setInterval(() => {
    if (stepsLeft <= 0 || gameState !== "PLAY") {
      clearInterval(climbInterval);
      isAutoClimbing = false;
      return;
    }

    const nextY = player.y + 1;
    const nextStair = stairs[nextY];

    if (!nextStair) {
      clearInterval(climbInterval);
      isAutoClimbing = false;
      return;
    }

    const requiredDir = nextStair.x - player.x;
    const needTurn = (requiredDir !== player.dir);

    step(needTurn);
    energy = MAX_ENERGY;

    stepsLeft--;
  }, 40);
}

goldenRushBtn.addEventListener("click", triggerGoldenRush);

window.addEventListener("keydown", (e) => {
  if (isAutoClimbing || gameState === "REVIVE_COUNTDOWN") return;

  if (listeningTarget) {
    e.preventDefault();
    const cleanLabel = e.key === " " ? "SPACE" : (e.key.length === 1 ? e.key.toUpperCase() : e.code.replace("Key", "").replace("Arrow", ""));
    keyBindings[listeningTarget] = { code: e.code, label: cleanLabel };
    listeningTarget = null;
    bindTurnBtn.classList.remove("listening");
    bindClimbBtn.classList.remove("listening");
    updateKeyLabels();
    return;
  }

  if (e.repeat) return;
  if (e.code === "Space" && gameState === "GAMEOVER") {
    initGame();
    gameState = "PLAY";
    return;
  }

  if (e.code === keyBindings.turn.code || e.key === "ArrowLeft") {
    step(true);
  } else if (e.code === keyBindings.climb.code || e.key === "ArrowUp") {
    step(false);
  }
});

function initGame() {
  if (countdownTimer) clearInterval(countdownTimer);
  score = 0;
  energy = 1.0;
  reviveHearts = 0;
  lastHeartThreshold = 0;
  boosterUsed = false;
  currentProvocation = "";
  stairs = [{ x: 0, y: 0 }];

  let curX = 0;
  let curDir = 1;
  let runLength = 3;

  for (let i = 1; i < 200; i++) {
    if (runLength <= 0) {
      curDir = -curDir;
      runLength = Math.floor(Math.random() * 4) + 1;
    }
    curX += curDir;
    stairs.push({ x: curX, y: i });
    runLength--;
  }

  player.x = 0;
  player.y = 0;
  player.dir = 1;
  player.scaleX = 1;
  player.scaleY = 1;
  player.bounceY = 0;
  lastSafeStair = { x: 0, y: 0 };

  camX = 0;
  camY = 0;
  targetCamX = 0;
  targetCamY = 0;
}

function appendNextStair() {
  const last = stairs[stairs.length - 1];
  const prev = stairs[stairs.length - 2];
  let curDir = last.x - prev.x;
  if (Math.random() < 0.36) curDir = -curDir;
  stairs.push({ x: last.x + curDir, y: last.y + 1 });
}

function checkHeartReward() {
  if (!isNormalMode) return;

  const currentThreshold = Math.floor(score / 200);
  if (currentThreshold > lastHeartThreshold) {
    const gained = currentThreshold - lastHeartThreshold;
    reviveHearts += gained;
    lastHeartThreshold = currentThreshold;
    playHeartEarnSound();
  }
}

function startReviveCountdown() {
  gameState = "REVIVE_COUNTDOWN";
  countdownNumber = 3;
  energy = MAX_ENERGY;

  playBeep(440, "sine", 0.08);

  if (countdownTimer) clearInterval(countdownTimer);

  countdownTimer = setInterval(() => {
    countdownNumber--;
    if (countdownNumber > 0) {
      playBeep(440, "sine", 0.08);
    } else if (countdownNumber === 0) {
      playBeep(880, "triangle", 0.15);
    } else {
      clearInterval(countdownTimer);
      countdownTimer = null;
      energy = MAX_ENERGY;
      gameState = "PLAY";
    }
  }, 1000);
}

function tryRevive() {
  if (!isNormalMode) return false;

  if (reviveHearts > 0) {
    reviveHearts--;
    player.x = lastSafeStair.x;
    player.y = lastSafeStair.y;
    player.bounceY = -12;
    player.scaleX = 1.2;
    player.scaleY = 0.8;

    targetCamX = player.x * STAIR_W;
    targetCamY = player.y * STAIR_H;

    playReviveSound();
    startReviveCountdown();
    return true;
  }
  return false;
}

function step(isTurn) {
  if (gameState === "READY") gameState = "PLAY";
  if (gameState !== "PLAY") return;

  if (isTurn) {
    player.dir = -player.dir;
  }

  const nextTargetX = player.x + player.dir;
  const nextTargetY = player.y + 1;
  const expectedStair = stairs[nextTargetY];

  if (expectedStair && expectedStair.x === nextTargetX) {
    player.x = nextTargetX;
    player.y = nextTargetY;
    lastSafeStair = { x: player.x, y: player.y };
    score++;
    if (score > highScore) {
      highScore = score;
    }
    energy = Math.min(MAX_ENERGY, energy + 0.13);

    checkHeartReward();

    player.bounceY = -7;
    player.scaleX = 0.92;
    player.scaleY = 1.12;

    targetCamX = player.x * STAIR_W;
    targetCamY = player.y * STAIR_H;

    appendNextStair();
    playBeep(480 + (score % 16) * 18, "sine", 0.04);
  } else {
    if (!tryRevive()) {
      player.x = nextTargetX;
      player.y = nextTargetY;
      gameOver();
    }
  }
}

function gameOver() {
  gameState = "GAMEOVER";
  currentProvocation = getProvocationText(score, boosterUsed);
  playBeep(130, "sawtooth", 0.25);
  recordGameResult(score);
}

const turnBtn = document.getElementById("btn-turn");
const climbBtn = document.getElementById("btn-climb");
const bindTouch = (btn, isTurn) => {
  const trigger = (e) => {
    e.preventDefault();
    if (isAutoClimbing || gameState === "REVIVE_COUNTDOWN") return;
    if (gameState === "GAMEOVER") {
      initGame();
      gameState = "PLAY";
      return;
    }
    step(isTurn);
  };
  btn.addEventListener("touchstart", trigger, { passive: false });
  btn.addEventListener("mousedown", trigger);
};
bindTouch(turnBtn, true);
bindTouch(climbBtn, false);

function update() {
  if (gameState === "PLAY" && !isAutoClimbing) {
    const drain = 0.0036 + Math.min(score * 0.00008, 0.009);
    energy -= drain;
    if (energy <= 0) {
      if (!tryRevive()) {
        energy = 0;
        gameOver();
      }
    }
  }

  camX += (targetCamX - camX) * 0.35;
  camY += (targetCamY - camY) * 0.35;

  player.bounceY += (0 - player.bounceY) * 0.28;
  player.scaleX += (1 - player.scaleX) * 0.22;
  player.scaleY += (1 - player.scaleY) * 0.22;
}

function drawCosmicBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, "#050210");
  grad.addColorStop(0.5, "#0b0722");
  grad.addColorStop(1, "#180a36");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  spaceStars.forEach(s => {
    s.alpha += s.glowSpeed;
    const a = (Math.sin(s.alpha) + 1) / 2;
    ctx.fillStyle = `rgba(220, 240, 255, ${a * 0.8 + 0.2})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawNeonStair(x, y, isCurrent) {
  const w = STAIR_W;
  const h = STAIR_H;
  const rx = x - w / 2;

  ctx.save();
  ctx.fillStyle = isCurrent ? "rgba(0, 242, 254, 0.25)" : "rgba(80, 25, 140, 0.4)";
  ctx.fillRect(rx, y, w, h);
  ctx.fillStyle = isCurrent ? "#ffffff" : "#c084fc";
  ctx.fillRect(rx, y, w, 3);
  ctx.strokeStyle = isCurrent ? "#00f2fe" : "#7928ca";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(rx, y, w, h);
  ctx.restore();
}

function drawHUD() {
  const bw = 240;
  const bh = 12;
  const bx = (canvas.width - bw) / 2;
  const by = 20;

  ctx.fillStyle = "rgba(10, 8, 30, 0.8)";
  ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
  ctx.strokeStyle = "#7928ca";
  ctx.strokeRect(bx - 2, by - 2, bw + 4, bh + 4);

  const fillW = Math.max(0, bw * energy);
  ctx.fillStyle = energy > 0.3 ? "#00f2fe" : "#ff007f";
  ctx.fillRect(bx, by, fillW, bh);

  if (isNormalMode) {
    ctx.save();
    ctx.textAlign = "left";
    ctx.font = "bold 15px monospace";
    ctx.fillStyle = reviveHearts > 0 ? "#ff007f" : "#64748b";
    ctx.shadowColor = reviveHearts > 0 ? "#ff007f" : "transparent";
    ctx.shadowBlur = reviveHearts > 0 ? 8 : 0;
    ctx.fillText(`❤️ x ${reviveHearts}`, bx, by + 30);
    ctx.restore();
  }

  ctx.save();
  ctx.font = "900 40px sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(score, canvas.width / 2, 85);
  ctx.restore();

  if (gameState === "READY") {
    ctx.fillStyle = "rgba(5, 3, 15, 0.75)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00f2fe";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("COSMIC INFINITE STAIRS", canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "14px sans-serif";
    ctx.fillText("하단 버튼 또는 키를 눌러 출발!", canvas.width / 2, canvas.height / 2 + 15);
  } else if (gameState === "GAMEOVER") {
    ctx.fillStyle = "rgba(10, 5, 20, 0.88)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.textAlign = "center";

    // 1. GAME OVER 타이틀
    ctx.fillStyle = "#ff007f";
    ctx.font = "900 36px sans-serif";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 50);

    // 2. 점수 현황
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px monospace";
    ctx.fillText(`SCORE: ${score} (BEST: ${highScore})`, canvas.width / 2, canvas.height / 2 - 10);

    // 3. 층수별 팩폭 도발 문구
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 13px sans-serif";
    ctx.shadowColor = "#facc15";
    ctx.shadowBlur = 8;
    ctx.fillText(`"${currentProvocation}"`, canvas.width / 2, canvas.height / 2 + 25);

    // 4. 부스터 사용 시에만 경고 출력 (미사용 시 클린 문구 완전 삭제)
    let nextY = canvas.height / 2 + 65;
    if (boosterUsed) {
      ctx.fillStyle = "#ff0055";
      ctx.font = "bold 14px sans-serif";
      ctx.shadowColor = "#ff0055";
      ctx.shadowBlur = 12;
      ctx.fillText("⚠️ 부스터 사용 감지됨, 꺼드럭 금지", canvas.width / 2, nextY);
      nextY += 35;
    }

    // 5. 재시작 안내
    ctx.fillStyle = "#a855f7";
    ctx.font = "13px sans-serif";
    ctx.shadowBlur = 0;
    ctx.fillText("버튼 터치 시 재시작", canvas.width / 2, nextY);
    ctx.restore();

  } else if (gameState === "REVIVE_COUNTDOWN") {
    ctx.fillStyle = "rgba(5, 3, 15, 0.78)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff007f";
    ctx.font = "bold 20px sans-serif";
    ctx.shadowColor = "#ff007f";
    ctx.shadowBlur = 12;
    ctx.fillText("REVIVED!", canvas.width / 2, canvas.height / 2 - 60);

    ctx.fillStyle = countdownNumber === 0 ? "#00f2fe" : "#ffd700";
    ctx.shadowColor = countdownNumber === 0 ? "#00f2fe" : "#ffd700";
    ctx.shadowBlur = 20;
    ctx.font = "900 70px monospace";
    ctx.fillText(countdownNumber === 0 ? "GO!" : countdownNumber, canvas.width / 2, canvas.height / 2 + 20);

    ctx.font = "13px sans-serif";
    ctx.fillStyle = "#94a3b8";
    ctx.shadowBlur = 0;
    ctx.fillText("준비하세요...", canvas.width / 2, canvas.height / 2 + 65);
    ctx.restore();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawCosmicBackground();

  stairs.forEach((s) => {
    const screenX = ANCHOR_X + (s.x * STAIR_W) - camX;
    const screenY = ANCHOR_Y - (s.y * STAIR_H) + camY;
    if (screenY > -50 && screenY < canvas.height + 50) {
      drawNeonStair(screenX, screenY, s.y === player.y);
    }
  });

  const pScreenX = ANCHOR_X + (player.x * STAIR_W) - camX;
  const pScreenY = ANCHOR_Y - (player.y * STAIR_H) + camY;
  drawPlayerSprite(pScreenX, pScreenY);

  drawHUD();

  requestAnimationFrame(() => {
    update();
    draw();
  });
}

updateModeUI();
updateKeyLabels();
renderCharacterRoster();
renderHistoryTable();
initGame();

Promise.all([
  cleanAndProcessImage("sheet8.png", "sheet8"),
  cleanAndProcessImage("among.svg", "among"),
  cleanAndProcessImage("pixel1.svg", "pixel1"),
  cleanAndProcessImage("pixel2.svg", "pixel2")
]).then(() => {
  draw();
});
</script>
</body>
</html>
