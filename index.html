<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cosmic Infinite Stairs - 비율 고정 & 전 이미지 투명화</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #05030e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Pretendard, sans-serif;
      color: #fff;
      overflow: hidden;
    }
    #mobile-frame {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      background: #08061a;
      border: 2px solid #2d1b54;
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #top-bar {
      height: 46px;
      background: #0d0926;
      border-bottom: 1px solid #231647;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
    }
    .app-title {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #a855f7;
      text-transform: uppercase;
    }
    #settings-btn {
      background: #161038;
      border: 1px solid #7928ca;
      border-radius: 8px;
      color: #00f2fe;
      font-size: 16px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 242, 254, 0.2);
    }
    #settings-btn:active { transform: scale(0.92); }

    #canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    #touch-controller {
      height: 95px;
      background: rgba(10, 7, 26, 0.95);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 10px 16px;
      border-top: 1px solid #3b286d;
      z-index: 10;
    }
    .game-btn {
      background: linear-gradient(180deg, #1b1340 0%, #0c0824 100%);
      border: 2px solid #00f2fe;
      border-radius: 14px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 242, 254, 0.2);
      touch-action: manipulation;
    }
    .game-btn:active {
      transform: scale(0.96);
      background: #00f2fe;
      color: #050515;
    }
    .game-btn.turn-btn {
      border-color: #ff007f;
      box-shadow: 0 4px 14px rgba(255, 0, 127, 0.2);
    }
    .game-btn.turn-btn:active {
      background: #ff007f;
      color: #fff;
    }
    .game-btn span.sub-key {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 2px;
      color: #facc15;
    }

    #character-roster {
      height: 95px;
      background: #05030f;
      border-top: 1px solid #231647;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 10;
    }
    #character-roster::-webkit-scrollbar { display: none; }
    .char-card {
      flex: 0 0 76px;
      height: 78px;
      background: #110d2b;
      border: 2px solid #372866;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }
    .char-card.selected {
      border-color: #00f2fe;
      background: #1b1347;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.35);
    }
    .char-card .card-name {
      font-size: 11px;
      font-weight: bold;
      margin-top: 4px;
      text-align: center;
    }
    .char-card .card-status {
      font-size: 9px;
      color: #a855f7;
      text-align: center;
      margin-top: 2px;
    }
    .char-card.selected .card-status {
      color: #00f2fe;
      font-weight: bold;
    }

    #settings-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 2, 15, 0.88);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-box {
      width: 90%;
      background: #120e2e;
      border: 2px solid #7928ca;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(121, 40, 202, 0.4);
    }
    .modal-title {
      font-size: 16px;
      font-weight: bold;
      color: #00f2fe;
      text-align: center;
      margin-bottom: 16px;
    }
    .key-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 14px;
    }
    .key-assign-btn {
      background: #1f1847;
      border: 1px solid #3b82f6;
      color: #facc15;
      font-size: 13px;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      min-width: 80px;
      text-align: center;
    }
    .key-assign-btn.listening {
      border-color: #ff007f;
      background: #3b0724;
      color: #ff007f;
      animation: blink 0.8s infinite;
    }
    @keyframes blink { 50% { opacity: 0.5; } }
    .modal-close-btn {
      width: 100%;
      background: #00f2fe;
      border: none;
      color: #05030e;
      font-weight: 800;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div id="mobile-frame">
  <div id="top-bar">
    <div class="app-title">Cosmic Stairs</div>
    <button id="settings-btn">⚙️</button>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="400" height="560"></canvas>
  </div>
  
  <div id="touch-controller">
    <button class="game-btn turn-btn" id="btn-turn">
      방향 전환
      <span class="sub-key" id="turn-key-label"></span>
    </button>
    <button class="game-btn" id="btn-climb">
      오르기
      <span class="sub-key" id="climb-key-label"></span>
    </button>
  </div>

  <div id="character-roster"></div>

  <!-- 설정 모달 -->
  <div id="settings-modal">
    <div class="modal-box">
      <div class="modal-title">키 매핑 설정</div>
      <div class="key-row">
        <span>방향 전환 키:</span>
        <button class="key-assign-btn" id="bind-turn-btn"></button>
      </div>
      <div class="key-row">
        <span>오르기 키:</span>
        <button class="key-assign-btn" id="bind-climb-btn"></button>
      </div>
      <div style="font-size: 11px; color: #94a3b8; text-align: center; margin-top: 8px;">
        버튼을 누르고 변경할 키를 입력하세요.
      </div>
      <button class="modal-close-btn" id="close-modal-btn">설정 완료</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Web Audio API
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(freq, type = "sine", duration = 0.04) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

// ==========================================
// 모든 이미지 전역 크로마키(투명화) 파이프라인
// ==========================================
const rawImages = {
  sheet8: new Image(),
  among: new Image(),
  pixel1: new Image(),
  pixel2: new Image()
};

// 투명 처리 완료된 오프스크린 캔버스 캐시
const processedCanvases = {
  sheet8: null,
  among: null,
  pixel1: null,
  pixel2: null
};

function processChromaKey(img, key) {
  try {
    const off = document.createElement("canvas");
    off.width = img.naturalWidth || img.width;
    off.height = img.naturalHeight || img.height;
    const octx = off.getContext("2d");
    octx.drawImage(img, 0, 0);

    const imgData = octx.getImageData(0, 0, off.width, off.height);
    const d = imgData.data;

    // 흰색 및 밝은 회색 계열(R,G,B > 235) 픽셀 완전 투명화
    for (let i = 0; i < d.length; i += 4) {
      if (d[i] > 235 && d[i + 1] > 235 && d[i + 2] > 235) {
        d[i + 3] = 0;
      }
    }
    octx.putImageData(imgData, 0, 0);
    processedCanvases[key] = off;
  } catch (err) {
    // CORS 보안 제약 발생 시 원본 이미지 대체
    processedCanvases[key] = img;
  }
}

// 이미지별 로드 바인딩
Object.keys(rawImages).forEach(key => {
  rawImages[key].onload = () => processChromaKey(rawImages[key], key);
});

rawImages.sheet8.src = "sheet8.png";
rawImages.among.src = "among.svg";
rawImages.pixel1.src = "pixel1.svg";
rawImages.pixel2.src = "pixel2.svg";

// 계단 물리 규격
const STAIR_W = 58;
const STAIR_H = 30;
const ANCHOR_X = canvas.width / 2;
const ANCHOR_Y = canvas.height - 120;

let gameState = "READY";
let score = 0;
let highScore = 0;
let energy = 1.0;
const MAX_ENERGY = 1.0;

let camX = 0;
let camY = 0;
let targetCamX = 0;
let targetCamY = 0;

const keyBindings = {
  turn: { code: "KeyZ", label: "Z" },
  climb: { code: "KeyX", label: "X" }
};
let listeningTarget = null;

// 11종 전체 캐릭터 메타데이터
const characters = [
  { id: "businessman", name: "비즈니스맨", sourceKey: "sheet8", grid: { col: 1, row: 2 } },
  { id: "boxer", name: "복서", sourceKey: "sheet8", grid: { col: 0, row: 1 } },
  { id: "dracula", name: "드라큘라", sourceKey: "sheet8", grid: { col: 0, row: 3 } },
  { id: "delivery", name: "택배기사", sourceKey: "sheet8", grid: { col: 1, row: 3 } },
  { id: "sheriff", name: "보안관", sourceKey: "sheet8", grid: { col: 1, row: 1 } },
  { id: "tennis", name: "테니스선수", sourceKey: "sheet8", grid: { col: 0, row: 2 } },
  { id: "soldier", name: "근위병", sourceKey: "sheet8", grid: { col: 0, row: 0 } },
  { id: "bunny", name: "바니걸", sourceKey: "sheet8", grid: { col: 1, row: 0 } },
  { id: "among", name: "어몽어스", sourceKey: "among" },
  { id: "redboy", name: "빨간티소년", sourceKey: "pixel1" },
  { id: "redhair", name: "붉은머리소년", sourceKey: "pixel2" }
];
let currentSelectedChar = "businessman";

const player = {
  x: 0,
  y: 0,
  dir: 1,
  scaleX: 1,
  scaleY: 1,
  bounceY: 0,
  animFrame: 0
};

let stairs = [];

const spaceStars = Array.from({ length: 45 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 1.5 + 0.5,
  alpha: Math.random(),
  glowSpeed: Math.random() * 0.02 + 0.01
}));

// ==========================================
// 비율 고정 축소 스프라이트 렌더러
// ==========================================
function drawPlayerSprite(x, y) {
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(y + player.bounceY));
  ctx.scale(player.dir * player.scaleX, player.scaleY);

  // 캐릭터 발밑 그림자
  ctx.fillStyle = "rgba(0, 242, 254, 0.25)";
  ctx.beginPath();
  ctx.ellipse(0, -player.bounceY, 14, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  const char = characters.find(c => c.id === currentSelectedChar) || characters[0];
  const src = processedCanvases[char.sourceKey] || rawImages[char.sourceKey];
  const frame = player.animFrame % 2;

  if (src && (src.width || src.naturalWidth)) {
    const totalW = src.width || src.naturalWidth;
    const totalH = src.height || src.naturalHeight;

    let sx = 0, sy = 0, sw = totalW, sh = totalH;

    if (char.sourceKey === "sheet8") {
      const blockW = totalW / 2;
      const blockH = totalH / 4;
      sw = blockW / 4;
      sh = blockH / 2;
      const blockX = char.grid.col * blockW;
      const blockY = char.grid.row * blockH;
      sx = blockX + (frame === 0 ? sw * 1 : sw * 3);
      sy = blockY;
    } else if (char.sourceKey === "pixel1" || char.sourceKey === "pixel2") {
      sw = totalW / 4;
      sh = totalH / 4;
      sx = (frame * 2 + 1) * sw;
      sy = 2 * sh; // 측면 걷기 모션
    } else if (char.sourceKey === "among") {
      sx = 0; sy = 0;
      sw = totalW; sh = totalH;
    }

    // 캐릭터 비율(Aspect Ratio) 엄격 고정 축소 계산
    const TARGET_MAX_H = 44; // 계단 높이에 맞춘 표준 캐릭터 세로 크기
    const TARGET_MAX_W = 44;
    const aspect = sw / sh;

    let drawW, drawH;
    if (aspect > 1) {
      drawW = TARGET_MAX_W;
      drawH = TARGET_MAX_W / aspect;
    } else {
      drawH = TARGET_MAX_H;
      drawW = TARGET_MAX_H * aspect;
    }

    // 발바닥(y=0) 기준 중심 정렬 렌더링
    ctx.drawImage(src, sx, sy, sw, sh, -drawW / 2, -drawH, drawW, drawH);

  } else {
    // 로딩 대기 대체 박스
    ctx.fillStyle = "#00f2fe";
    ctx.fillRect(-10, -32, 20, 32);
  }

  ctx.restore();
}

function updateKeyLabels() {
  document.getElementById("turn-key-label").innerText = `[${keyBindings.turn.label}]`;
  document.getElementById("climb-key-label").innerText = `[${keyBindings.climb.label}]`;
  document.getElementById("bind-turn-btn").innerText = keyBindings.turn.label;
  document.getElementById("bind-climb-btn").innerText = keyBindings.climb.label;
}

const settingsBtn = document.getElementById("settings-btn");
const settingsModal = document.getElementById("settings-modal");
const closeModalBtn = document.getElementById("close-modal-btn");
const bindTurnBtn = document.getElementById("bind-turn-btn");
const bindClimbBtn = document.getElementById("bind-climb-btn");

settingsBtn.addEventListener("click", () => {
  settingsModal.style.display = "flex";
});
closeModalBtn.addEventListener("click", () => {
  settingsModal.style.display = "none";
  listeningTarget = null;
  bindTurnBtn.classList.remove("listening");
  bindClimbBtn.classList.remove("listening");
});

bindTurnBtn.addEventListener("click", () => {
  listeningTarget = "turn";
  bindTurnBtn.classList.add("listening");
  bindClimbBtn.classList.remove("listening");
  bindTurnBtn.innerText = "키 입력...";
});

bindClimbBtn.addEventListener("click", () => {
  listeningTarget = "climb";
  bindClimbBtn.classList.add("listening");
  bindTurnBtn.classList.remove("listening");
  bindClimbBtn.innerText = "키 입력...";
});

window.addEventListener("keydown", (e) => {
  if (listeningTarget) {
    e.preventDefault();
    const cleanLabel = e.key === " " ? "SPACE" : (e.key.length === 1 ? e.key.toUpperCase() : e.code.replace("Key", "").replace("Arrow", ""));
    keyBindings[listeningTarget] = { code: e.code, label: cleanLabel };
    listeningTarget = null;
    bindTurnBtn.classList.remove("listening");
    bindClimbBtn.classList.remove("listening");
    updateKeyLabels();
    return;
  }

  if (e.repeat) return;
  if (e.code === "Space" && gameState === "GAMEOVER") {
    initGame();
    gameState = "PLAY";
    return;
  }

  if (e.code === keyBindings.turn.code || e.key === "ArrowLeft") {
    step(true);
  } else if (e.code === keyBindings.climb.code || e.key === "ArrowUp") {
    step(false);
  }
});

function renderCharacterRoster() {
  const roster = document.getElementById("character-roster");
  roster.innerHTML = "";

  characters.forEach(ch => {
    const isSelected = ch.id === currentSelectedChar;
    const card = document.createElement("div");
    card.className = `char-card ${isSelected ? 'selected' : ''}`;
    
    card.innerHTML = `
      <div style="font-size: 18px;">${getCharIcon(ch.id)}</div>
      <div class="card-name">${ch.name}</div>
      <div class="card-status">${isSelected ? '선택됨' : '선택'}</div>
    `;

    card.addEventListener("click", () => {
      currentSelectedChar = ch.id;
      renderCharacterRoster();
    });

    roster.appendChild(card);
  });
}

function getCharIcon(id) {
  const map = {
    businessman: "💼", boxer: "🥊", dracula: "🧛", delivery: "📦",
    sheriff: "🤠", tennis: "🎾", soldier: "💂", bunny: "🐰",
    among: "🚀", redboy: "👦", redhair: "🧑"
  };
  return map[id] || "👤";
}

function initGame() {
  score = 0;
  energy = 1.0;
  stairs = [{ x: 0, y: 0 }];

  let curX = 0;
  let curDir = 1;
  let runLength = 3;

  for (let i = 1; i < 120; i++) {
    if (runLength <= 0) {
      curDir = -curDir;
      runLength = Math.floor(Math.random() * 4) + 1;
    }
    curX += curDir;
    stairs.push({ x: curX, y: i });
    runLength--;
  }

  player.x = 0;
  player.y = 0;
  player.dir = 1;
  player.scaleX = 1;
  player.scaleY = 1;
  player.bounceY = 0;
  player.animFrame = 0;

  camX = 0;
  camY = 0;
  targetCamX = 0;
  targetCamY = 0;
}

function appendNextStair() {
  const last = stairs[stairs.length - 1];
  const prev = stairs[stairs.length - 2];
  let curDir = last.x - prev.x;
  if (Math.random() < 0.36) curDir = -curDir;
  stairs.push({ x: last.x + curDir, y: last.y + 1 });
}

function step(isTurn) {
  if (gameState === "READY") gameState = "PLAY";
  if (gameState !== "PLAY") return;

  if (isTurn) {
    player.dir = -player.dir;
  }

  const nextTargetX = player.x + player.dir;
  const nextTargetY = player.y + 1;
  const expectedStair = stairs[nextTargetY];

  if (expectedStair && expectedStair.x === nextTargetX) {
    player.x = nextTargetX;
    player.y = nextTargetY;
    score++;
    if (score > highScore) {
      highScore = score;
    }
    energy = Math.min(MAX_ENERGY, energy + 0.13);

    player.animFrame = (player.animFrame + 1) % 2;
    player.bounceY = -6;
    player.scaleX = 0.92;
    player.scaleY = 1.12;

    targetCamX = player.x * STAIR_W;
    targetCamY = player.y * STAIR_H;

    appendNextStair();
    playBeep(480 + (score % 16) * 18, "sine", 0.04);
  } else {
    player.x = nextTargetX;
    player.y = nextTargetY;
    gameOver();
  }
}

function gameOver() {
  gameState = "GAMEOVER";
  playBeep(130, "sawtooth", 0.25);
}

const turnBtn = document.getElementById("btn-turn");
const climbBtn = document.getElementById("btn-climb");
const bindTouch = (btn, isTurn) => {
  const trigger = (e) => {
    e.preventDefault();
    if (gameState === "GAMEOVER") {
      initGame();
      gameState = "PLAY";
      return;
    }
    step(isTurn);
  };
  btn.addEventListener("touchstart", trigger, { passive: false });
  btn.addEventListener("mousedown", trigger);
};
bindTouch(turnBtn, true);
bindTouch(climbBtn, false);

function update() {
  if (gameState === "PLAY") {
    const drain = 0.0036 + Math.min(score * 0.00008, 0.009);
    energy -= drain;
    if (energy <= 0) {
      energy = 0;
      gameOver();
    }
  }

  camX += (targetCamX - camX) * 0.35;
  camY += (targetCamY - camY) * 0.35;

  player.bounceY += (0 - player.bounceY) * 0.28;
  player.scaleX += (1 - player.scaleX) * 0.22;
  player.scaleY += (1 - player.scaleY) * 0.22;
}

function drawCosmicBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, "#050210");
  grad.addColorStop(0.5, "#0b0722");
  grad.addColorStop(1, "#180a36");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  spaceStars.forEach(s => {
    s.alpha += s.glowSpeed;
    const a = (Math.sin(s.alpha) + 1) / 2;
    ctx.fillStyle = `rgba(220, 240, 255, ${a * 0.8 + 0.2})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawNeonStair(x, y, isCurrent) {
  const w = STAIR_W;
  const h = STAIR_H;
  const rx = x - w / 2;

  ctx.save();
  ctx.fillStyle = isCurrent ? "rgba(0, 242, 254, 0.25)" : "rgba(80, 25, 140, 0.4)";
  ctx.fillRect(rx, y, w, h);
  ctx.fillStyle = isCurrent ? "#ffffff" : "#c084fc";
  ctx.fillRect(rx, y, w, 3);
  ctx.strokeStyle = isCurrent ? "#00f2fe" : "#7928ca";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(rx, y, w, h);
  ctx.restore();
}

function drawHUD() {
  const bw = 240;
  const bh = 12;
  const bx = (canvas.width - bw) / 2;
  const by = 25;

  ctx.fillStyle = "rgba(10, 8, 30, 0.8)";
  ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
  ctx.strokeStyle = "#7928ca";
  ctx.strokeRect(bx - 2, by - 2, bw + 4, bh + 4);

  const fillW = Math.max(0, bw * energy);
  ctx.fillStyle = energy > 0.3 ? "#00f2fe" : "#ff007f";
  ctx.fillRect(bx, by, fillW, bh);

  ctx.save();
  ctx.font = "900 40px sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(score, canvas.width / 2, 85);
  ctx.restore();

  if (gameState === "READY") {
    ctx.fillStyle = "rgba(5, 3, 15, 0.75)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00f2fe";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("COSMIC INFINITE STAIRS", canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "14px sans-serif";
    ctx.fillText("하단 버튼 또는 키를 눌러 출발!", canvas.width / 2, canvas.height / 2 + 15);
  } else if (gameState === "GAMEOVER") {
    ctx.fillStyle = "rgba(10, 5, 20, 0.85)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ff007f";
    ctx.font = "900 36px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px monospace";
    ctx.fillText(`SCORE: ${score} (BEST: ${highScore})`, canvas.width / 2, canvas.height / 2 + 15);
    ctx.fillStyle = "#a855f7";
    ctx.font = "13px sans-serif";
    ctx.fillText("버튼 터치 시 재시작", canvas.width / 2, canvas.height / 2 + 50);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawCosmicBackground();

  stairs.forEach((s) => {
    const screenX = ANCHOR_X + (s.x * STAIR_W) - camX;
    const screenY = ANCHOR_Y - (s.y * STAIR_H) + camY;
    if (screenY > -50 && screenY < canvas.height + 50) {
      drawNeonStair(screenX, screenY, s.y === player.y);
    }
  });

  const pScreenX = ANCHOR_X + (player.x * STAIR_W) - camX;
  const pScreenY = ANCHOR_Y - (player.y * STAIR_H) + camY;
  drawPlayerSprite(pScreenX, pScreenY);

  drawHUD();

  requestAnimationFrame(() => {
    update();
    draw();
  });
}

updateKeyLabels();
renderCharacterRoster();
initGame();
draw();
</script>
</body>
</html>
